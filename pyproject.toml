# pyproject.toml
[tool.poetry]
name = "cvScore"
version = "0.1.4"
description = "A CLI application that scores CVs using keywords."
readme = "README.md"
authors = ["Philip Glebow <11603439+pglebow@users.noreply.github.com>"]
packages = [{include = "cvScore"}]

[tool.poetry.scripts]
cvScore = "cvScore.commands:main"

[tool.poetry.dependencies]
python = "^3.10"
click = "^8.4.2"
filetype="^1.2.0"
lxml="^6.1.1"
pypdf="^6.14.2"
python-docx="^1.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"